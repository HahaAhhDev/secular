name: release

# Publishes @hahaahhdev/secular to GitHub Packages whenever a version tag
# (v1.2.3) is pushed. Runs typecheck + tests as a safety gate first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install, build, test
        run: |
          npm ci
          npm run build
          npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: also publish to npmjs.org. Runs only when an NPM_TOKEN
      # secret exists; otherwise skipped silently. The npm name differs
      # (scoped vs unscoped) so add "name" handling here if you enable it.
      - name: Check for NPM_TOKEN
        id: npmtoken
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs.org
        if: steps.npmtoken.outputs.available == 'true'
        run: npm publish --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Build a self-contained tarball (dist/ + package.json + LICENSE + README)
      # and attach it to the GitHub Release. install.sh downloads this —
      # no npm, no auth, no git clone required.
      - name: Build install tarball
        run: |
          mkdir -p /tmp/pkg/secular-${GITHUB_REF_NAME}
          cp -r dist /tmp/pkg/secular-${GITHUB_REF_NAME}/
          cp package.json LICENSE README.md /tmp/pkg/secular-${GITHUB_REF_NAME}/
          tar -czf "/tmp/secular-${GITHUB_REF_NAME}.tar.gz" -C /tmp/pkg "secular-${GITHUB_REF_NAME}"
          shasum -a 256 "/tmp/secular-${GITHUB_REF_NAME}.tar.gz" > "/tmp/secular-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Create / update GitHub Release with tarball
        run: |
          gh release create "$GITHUB_REF_NAME" --title "secular $GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" \
            "/tmp/secular-${GITHUB_REF_NAME}.tar.gz" \
            "/tmp/secular-${GITHUB_REF_NAME}.tar.gz.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
