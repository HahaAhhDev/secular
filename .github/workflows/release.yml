name: release

# Publishes @hahaahhdev/secular to GitHub Packages whenever a version tag
# (v1.2.3) is pushed. Runs typecheck + tests as a safety gate first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install, build, test
        run: |
          npm ci
          npm run build
          npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: also publish to npmjs.org. Runs only when an NPM_TOKEN
      # secret exists; otherwise skipped silently. The npm name differs
      # (scoped vs unscoped) so add "name" handling here if you enable it.
      - name: Check for NPM_TOKEN
        id: npmtoken
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs.org
        if: steps.npmtoken.outputs.available == 'true'
        run: npm publish --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
